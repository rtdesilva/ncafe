<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Cafe - Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B00',
                        secondary: '#0B1120',
                        'dark-bg': '#0B1121',
                        'dark-surface': '#161E2E',
                        'dark-border': '#1E293B',
                        'dark-muted': '#94A3B8'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-dark-bg transition-colors duration-300">
    <div id="login-screen"
        class="hidden max-w-md mx-auto min-h-screen relative flex items-center justify-center bg-gray-50 dark:bg-dark-bg transition-colors duration-300 overflow-hidden shadow-2xl">
        <!-- Background Elements -->
        <div class="absolute inset-0 z-0">
            <div
                class="absolute top-1/4 left-0 w-64 h-64 bg-primary/20 blur-[80px] rounded-full mix-blend-multiply dark:mix-blend-screen opacity-70 animate-pulse">
            </div>
            <div
                class="absolute bottom-1/4 right-0 w-80 h-80 bg-purple-500/20 blur-[100px] rounded-full mix-blend-multiply dark:mix-blend-screen opacity-50">
            </div>
        </div>

        <!-- Login Card -->
        <div class="w-full p-8 relative z-10 animate-fade-in">
            <div
                class="bg-white/70 dark:bg-dark-surface/70 backdrop-blur-xl rounded-[2.5rem] p-8 border border-white/40 dark:border-dark-border/50 shadow-2xl">
                <div class="text-center mb-8">
                    <div
                        class="w-16 h-16 bg-gradient-to-br from-primary to-orange-600 rounded-[1.2rem] flex items-center justify-center text-white shadow-lg shadow-orange-500/30 mx-auto mb-5 transform -rotate-3 hover:rotate-0 transition-all duration-300">
                        <i data-lucide="coffee" class="w-8 h-8"></i>
                    </div>
                    <h1 class="text-2xl font-[900] tracking-tight text-secondary dark:text-gray-100 mb-1">Staff Portal
                    </h1>
                    <p class="text-[10px] font-bold text-gray-400 dark:text-dark-muted uppercase tracking-[0.2em]">
                        Authorized Access Only</p>
                </div>

                <div id="staff-pin-step" class="space-y-6">
                    <p
                        class="text-[10px] font-bold text-gray-400 dark:text-dark-muted uppercase tracking-widest leading-relaxed">
                        Enter your 4-digit master PIN to access the login terminal.</p>

                    <div id="staff-pin-error"
                        class="hidden bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-[10px] font-bold px-3 py-2 rounded-xl text-center animate-shake">
                    </div>

                    <div class="flex justify-center gap-3 mb-6" id="staff-pin-dots">
                        <div
                            class="ncafe-pin-dot w-3.5 h-3.5 rounded-full border-2 border-gray-300 dark:border-dark-muted transition-all duration-300">
                        </div>
                        <div
                            class="ncafe-pin-dot w-3.5 h-3.5 rounded-full border-2 border-gray-300 dark:border-dark-muted transition-all duration-300">
                        </div>
                        <div
                            class="ncafe-pin-dot w-3.5 h-3.5 rounded-full border-2 border-gray-300 dark:border-dark-muted transition-all duration-300">
                        </div>
                        <div
                            class="ncafe-pin-dot w-3.5 h-3.5 rounded-full border-2 border-gray-300 dark:border-dark-muted transition-all duration-300">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3 max-w-[240px] mx-auto" id="staff-pin-grid">
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="1">1</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="2">2</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="3">3</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="4">4</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="5">5</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="6">6</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="7">7</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="8">8</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="9">9</button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-lg font-bold text-red-500 hover:bg-red-100 dark:hover:bg-red-500/20 active:scale-95 transition-all flex items-center justify-center w-14 h-14 mx-auto"
                            data-val="clear"><i data-lucide="delete" class="w-5 h-5"></i></button>
                        <button type="button"
                            class="staff-pin-btn aspect-square rounded-xl bg-gray-50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border text-lg font-bold text-secondary dark:text-gray-200 hover:bg-orange-50 hover:text-primary hover:border-primary/30 active:scale-95 transition-all w-14 h-14 mx-auto"
                            data-val="0">0</button>
                        <div class="aspect-square"></div> <!-- Empty space -->
                    </div>
                </div>

                <form id="staff-login-form" class="space-y-4 hidden animate-fade-in">
                    <div id="login-error"
                        class="hidden bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-xs font-bold px-4 py-3 rounded-xl text-center">
                    </div>

                    <div class="space-y-1.5">
                        <label
                            class="block text-[10px] font-black text-gray-400 dark:text-dark-muted uppercase tracking-wider ml-2">Email
                            Address</label>
                        <div class="relative">
                            <i data-lucide="mail"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-gray-500"></i>
                            <input type="email" id="staff-email" required placeholder="Enter your email"
                                class="w-full pl-11 pr-4 py-3 bg-white/50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border backdrop-blur-sm rounded-xl text-sm font-bold text-secondary dark:text-gray-100 outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label
                            class="block text-[10px] font-black text-gray-400 dark:text-dark-muted uppercase tracking-wider ml-2">Password</label>
                        <div class="relative">
                            <i data-lucide="lock"
                                class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-gray-500"></i>
                            <input type="password" id="staff-password" required placeholder="Enter your password"
                                class="w-full pl-11 pr-4 py-3 bg-white/50 dark:bg-dark-bg/50 border border-gray-200 dark:border-dark-border backdrop-blur-sm rounded-xl text-sm font-bold text-secondary dark:text-gray-100 outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500">
                        </div>
                    </div>

                    <button type="submit" id="staff-login-btn"
                        class="w-full bg-primary hover:bg-orange-600 text-white py-3.5 rounded-xl font-[900] text-sm transition-all focus:ring-4 focus:ring-primary/20 shadow-xl shadow-orange-500/25 mt-6 flex items-center justify-center gap-2 group">
                        <span>Secure Login</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </form>

            </div>
        </div>
    </div>

    <div id="app"
        class="hidden max-w-md mx-auto min-h-screen bg-white dark:bg-dark-bg shadow-2xl transition-colors duration-300">
    </div>

    <script src="data.js"></script>
    <script src="staff.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
